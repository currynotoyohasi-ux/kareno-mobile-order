<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定｜カレーノとよはし</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
      background:#fff8e8;
      color:#222;
    }

    .wrap{
      max-width:480px;
      margin:60px auto;
      padding:24px;
    }

    .card{
      background:white;
      border-radius:20px;
      padding:28px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    h1{
      margin-top:0;
      font-size:26px;
    }

    p{
      line-height:1.7;
      color:#555;
    }

    input{
      width:100%;
      box-sizing:border-box;
      padding:14px;
      margin-top:12px;
      border:1px solid #ccc;
      border-radius:12px;
      font-size:18px;
    }

    button{
      width:100%;
      margin-top:18px;
      padding:15px;
      border:0;
      border-radius:12px;
      background:#f59e0b;
      color:white;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      opacity:.5;
    }

    #message{
      margin-top:18px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>🔐 パスワード再設定</h1>

    <p>
      新しい管理画面ログイン用パスワードを入力してください。
    </p>

    <input
      id="password"
      type="password"
      placeholder="新しいパスワード"
      autocomplete="new-password"
    >

    <input
      id="passwordConfirm"
      type="password"
      placeholder="新しいパスワードをもう一度"
      autocomplete="new-password"
    >

    <button id="resetBtn">
      パスワードを変更する
    </button>

    <div id="message"></div>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://xvpxioozkgmyrkhrfpdv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1bxgP0UIfxc5fWGLbwJhpQ_V6REmRv7";

const client =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const resetBtn =
  document.getElementById("resetBtn");

const message =
  document.getElementById("message");

resetBtn.addEventListener("click", async () => {

  const password =
    document.getElementById("password").value;

  const passwordConfirm =
    document.getElementById("passwordConfirm").value;

  message.textContent = "";

  if(password.length < 6){
    message.textContent =
      "パスワードは6文字以上にしてください";
    return;
  }

  if(password !== passwordConfirm){
    message.textContent =
      "パスワードが一致していません";
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = "変更中...";

  const { error } =
    await client.auth.updateUser({
      password: password
    });

  if(error){

    console.error(error);

    message.textContent =
      "パスワード変更に失敗しました。再設定メールをもう一度送ってください。";

    resetBtn.disabled = false;
    resetBtn.textContent =
      "パスワードを変更する";

    return;
  }

  message.textContent =
    "✅ パスワードを変更しました！";

  setTimeout(() => {
    window.location.href =
      "./admin.html";
  }, 1500);

});

</script>

</body>
</html>
