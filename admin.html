<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カレーノとよはし｜注文管理</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:21px;
}

header small{
  color:#ffc400;
}

.wrap{
  max-width:800px;
  margin:auto;
  padding:14px;
}

.card{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.login{
  max-width:430px;
  margin:40px auto;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 14px;
  font-size:15px;
  font-weight:800;
}

.primary{
  background:#e57a00;
  color:white;
  width:100%;
  margin-top:8px;
}

.topbar{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.refresh{
  background:#ffc400;
  color:#111;
}

.logout{
  background:#ddd;
  color:#111;
}

.order-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.number{
  font-size:25px;
  font-weight:900;
}

.time{
  font-size:20px;
  font-weight:900;
  color:#c85e00;
}

.customer{
  margin-top:7px;
  font-size:18px;
  font-weight:800;
}

.info{
  margin-top:6px;
  color:#555;
  line-height:1.6;
}

.items{
  background:#faf6e8;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
}

.item{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  font-weight:700;
}

.total{
  font-size:21px;
  font-weight:900;
  text-align:right;
  margin-top:10px;
}

.status{
  display:inline-block;
  margin-top:12px;
  padding:6px 10px;
  border-radius:999px;
  font-weight:900;
}

.status-new{background:#ffe5a3;}
.status-cooking{background:#ffd2a3;}
.status-ready{background:#b9efc5;}
.status-done{background:#ddd;}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.actions button{
  background:#222;
  color:white;
}

.actions .ready{
  background:#16833e;
}

.actions .done{
  background:#666;
}

.empty{
  text-align:center;
  padding:40px 10px;
  color:#777;
}

.error{
  color:#b42318;
  font-weight:800;
}

.hidden{
  display:none;
}
.status-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:14px 0;
}

.status-tab{
  padding:14px 10px;
  border:2px solid #222;
  border-radius:14px;
  background:#fff;
  font-weight:900;
  font-size:16px;
}

.status-tab.active{
  background:#ffc400;
}
</style>
</head>

<body>

<header>
  <h1>🦌 カレーノとよはし</h1>
  <small>ORDER MANAGEMENT</small>
</header>

<div class="wrap">

  <div id="loginBox" class="card login">
    <h2>管理者ログイン</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button id="loginBtn" class="primary">
      ログイン
    </button>

    <p id="loginError" class="error"></p>
  </div>

  <div id="adminBox" class="hidden">

    <div class="topbar">
      <button class="refresh" onclick="loadOrders()">
        🔄 更新
      </button>

      <button class="logout" onclick="logout()">
        ログアウト
      </button>
    </div>
<div class="status-tabs">
  <button id="tabCooking" class="status-tab active" type="button">
    🍳 調理開始
  </button>

  <button id="tabReady" class="status-tab" type="button">
    🛍️ 受取待ち
  </button>
</div>
    <div id="orders"></div>

  </div>

</div>

<script>
const SUPABASE_URL =
  "https://xvpxioozkgmyrkhrfpdv.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_1bxgP0UIfxc5fWGLbwJhpQ_V6REmRv7";

const client =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusName = {
  new: "新規注文",
  cooking: "調理中",
  ready: "受取待ち",
  done: "完了"
};

function yen(n){
  return "¥" + Number(n || 0).toLocaleString("ja-JP");
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatTime(value){
  if(!value) return "";

  const d = new Date(value);

  return d.toLocaleString(
    "ja-JP",
    {
      month:"numeric",
      day:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

document.getElementById("loginBtn").onclick =
async () => {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.textContent = "";

  const { error } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    errorBox.textContent =
      "ログインできませんでした。メールアドレスとパスワードを確認してください。";
    return;
  }

  showAdmin();
};

async function logout(){

  await client.auth.signOut();

  document.getElementById("adminBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");
}

async function showAdmin(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("adminBox")
    .classList.remove("hidden");

  await loadOrders();
}

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML =
    '<div class="card">注文を読み込み中...</div>';

  const { data:orders, error:orderError } =
    await client
      .from("orders")
      .select("*")
      .order("pickup_time", { ascending:true })
      .limit(50);

  if(orderError){
    box.innerHTML =
      '<div class="card error">'
      + escapeHtml(orderError.message)
      + '</div>';
    return;
  }

  if(!orders || orders.length === 0){
    box.innerHTML =
      '<div class="card empty">現在、注文はありません。</div>';
    return;
  }

  const ids =
    orders.map(o => o.id);

  const { data:items, error:itemError } =
    await client
      .from("order_items")
      .select("*")
      .in("order_id", ids);

  if(itemError){
    box.innerHTML =
      '<div class="card error">'
      + escapeHtml(itemError.message)
      + '</div>';
    return;
  }

  const grouped = {};

  (items || []).forEach(item => {

    if(!grouped[item.order_id]){
      grouped[item.order_id] = [];
    }

    grouped[item.order_id].push(item);

  });

  box.innerHTML = "";

  orders.forEach(order => {

    const orderItems =
      grouped[order.id] || [];

    const itemHtml =
      orderItems.map(item => `
        <div class="item">
          <span>
            ${escapeHtml(item.product_name)}
            × ${item.quantity}
          </span>

          <span>
            ${yen(item.subtotal)}
          </span>
        </div>
      `).join("");

    const status =
      order.status || "new";

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="order-head">

        <div>
          <div class="number">
            ${escapeHtml(order.order_number)}
          </div>

          <div class="customer">
            👤 ${escapeHtml(order.customer_name)} さん
          </div>
        </div>

        <div class="time">
          ${formatTime(order.pickup_time)}
        </div>

      </div>

      <div class="info">
        支払い：
        <b>${escapeHtml(order.payment_method)}</b>
      </div>

      <div class="items">
        ${itemHtml || "商品情報なし"}
      </div>

      <div class="total">
        合計 ${yen(order.total_amount)}
      </div>

      <div class="status status-${status}">
        ${statusName[status] || status}
      </div>

      <div class="actions">

        <button
          onclick="changeStatus(${order.id},'cooking')">
          🔥 調理開始
        </button>

        <button
          class="ready"
          onclick="changeStatus(${order.id},'ready')">
          ✅ 受取待ち
        </button>

        <button
          class="done"
          onclick="changeStatus(${order.id},'done')">
          完了
        </button>

        <button
          onclick="changeStatus(${order.id},'new')">
          ↩ 新規に戻す
        </button>

      </div>
    `;

    box.appendChild(card);

  });
}

async function changeStatus(id,status){

  const { error } =
    await client
      .from("orders")
      .update({
        status:status
      })
      .eq("id",id);

  if(error){
    alert(
      "変更できませんでした："
      + error.message
    );
    return;
  }

  await loadOrders();
}

async function checkLogin(){

  const {
    data:{ session }
  } =
    await client.auth.getSession();

  if(session){
    showAdmin();
  }
}

checkLogin();

/* 10秒ごとに注文一覧を自動更新 */
setInterval(async () => {

  const {
    data:{ session }
  } =
    await client.auth.getSession();

  if(session){
    loadOrders();
  }

},10000);

</script>

</body>
</html>
