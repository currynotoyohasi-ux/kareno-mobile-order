<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カレーノとよはし｜モバイルオーダー</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;
  background:#fff8e7;
  color:#222;
}
.app{
  max-width:720px;
  margin:auto;
  padding-bottom:110px;
}
header{
  background:linear-gradient(135deg,#ffc400,#ff9e00);
  border-bottom:4px solid #1a1a1a;
  padding:14px 16px;
  font-weight:900;
  font-size:21px;
}
  .header-brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.header-brand img{
  width:64px;
  height:64px;
  object-fit:contain;
  border-radius:12px;
  background:white;
  padding:4px;
}

.header-text{
  display:flex;
  flex-direction:column;
}

.header-text strong{
  font-size:24px;
  font-weight:900;
}

.header-text small{
  font-size:12px;
  font-weight:800;
}
.hero{
  margin:14px;
  background:#1a1a1a;
  color:#fff;
  border-radius:18px;
  padding:18px;
}
.hero h1{
  margin:0 0 6px;
  font-size:23px;
}
.hero p{
  margin:0;
  font-size:13px;
  line-height:1.6;
}
.section{
  padding:0 14px;
}
.section h2{
  font-size:19px;
  margin:16px 0 10px;
}
.menu{
  display:grid;
  gap:10px;
}
.card{
  background:#fff;
  border:1px solid #eadca7;
  border-radius:16px;
  padding:14px;
}
.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}
.name{
  font-weight:900;
  font-size:17px;
}
.cat{
  font-size:11px;
  color:#777;
  margin-top:3px;
}
.price{
  font-size:20px;
  font-weight:900;
  color:#cf6500;
}
.controls{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:9px;
  margin-top:10px;
}
.controls button{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #ddd;
  background:#fff;
  font-size:22px;
  font-weight:900;
}
.qty{
  min-width:28px;
  text-align:center;
  font-weight:900;
}
.form{
  background:#fff;
  border-radius:16px;
  padding:14px;
}
.field{
  margin-bottom:12px;
}
.field label{
  display:block;
  font-weight:900;
  font-size:13px;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:12px;
  border:2px solid #eadca7;
  border-radius:12px;
  font-size:16px;
  box-sizing:border-box;
}
.paygrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.pay{
  padding:12px;
  border-radius:12px;
  border:2px solid #eadca7;
  background:#fff;
  font-weight:900;
}
.pay.on{
  border-color:#e57a00;
  background:#fff2df;
}
.notice{
  margin:14px;
  background:#fff4c8;
  border:1px solid #e6c45f;
  border-radius:14px;
  padding:11px;
  font-size:12px;
  line-height:1.5;
}
.result{
  display:none;
  margin:14px;
  background:#fff;
  border-radius:16px;
  padding:20px;
  text-align:center;
}
.result.show{
  display:block;
}
.orderno{
  display:inline-block;
  background:#ffc400;
  border:3px solid #222;
  border-radius:14px;
  padding:8px 13px;
  font-size:27px;
  font-weight:900;
}
.statusbox{
  margin-top:18px;
  padding:18px 12px;
  border:2px solid #eadca7;
  border-radius:16px;
  background:#fff4c8;
}
.statusbox.cooking{
  background:#fff0dc;
}
.statusbox.ready{
  background:#e3f7e7;
  border-color:#55a765;
}
.statusbox.done{
  background:#eee;
  border-color:#bbb;
}
.statusicon{
  font-size:48px;
}
.statustitle{
  margin-top:5px;
  font-size:22px;
  font-weight:900;
}
.statusmessage{
  margin-top:7px;
  font-size:14px;
  line-height:1.6;
}
.err{
  color:#b42318;
  font-weight:900;
}
.cartbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px 14px;
}
.inner{
  max-width:720px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.total small{
  display:block;
  color:#777;
}
.total strong{
  font-size:25px;
  color:#cf6500;
}
.orderbtn{
  border:0;
  background:#e57a00;
  color:#fff;
  border-radius:14px;
  padding:14px 18px;
  font-weight:900;
  font-size:17px;
  min-width:45%;
}
.orderbtn:disabled{
  opacity:.45;
}
  .soldout{
  opacity:.45;
  filter:grayscale(1);
  position:relative;
}

.soldout::after{
  content:"SOLD OUT";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  color:#fff;
  background:rgba(0,0,0,.45);
  border-radius:18px;
  pointer-events:none;
}

.soldout button{
  pointer-events:none;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-brand">
    <img src="992418E9-F1D5-4D18-BB8E-DCB3D3DAEF84.png" alt="カレーノとよはし">
    <div class="header-text">
      <strong>カレーノとよはし</strong>
      <small>MOBILE ORDER</small>
    </div>
  </div>
</header>

<div class="hero">
<h1>モバイルオーダー</h1>
<p>商品を選んで、受取時間を指定してください。</p>
</div>

<div class="notice">
商品を選んでご注文ください。注文後、この画面で調理状況をご確認いただけます。
</div>

<section class="section">
<h2>MENU</h2>
<div id="menu" class="menu">
<div class="notice">商品を読み込み中...</div>
</div>
</section>

<section class="section">
<h2>受取情報</h2>

<div class="form">

<div class="field">
<label>お名前</label>
<input id="customerName" placeholder="例：いちかわ">
</div>

<div class="field">
<label>受取希望日時</label>
<input id="pickup" type="datetime-local">
</div>

<div class="field">
<label>お支払い方法</label>

<div class="paygrid">
<button class="pay on" data-pay="現金">💴 現金</button>
<button class="pay" data-pay="PayPay">📱 PayPay</button>
</div>

</div>
</div>
</section>

<div id="result" class="result"></div>

</div>

<div class="cartbar">
<div class="inner">

<div class="total">
<small>合計</small>
<strong id="total">¥0</strong>
</div>

<button id="orderBtn" class="orderbtn" disabled>
注文を確定
</button>

</div>
</div>

<script>
const SUPABASE_URL =
"https://xvpxioozkgmyrkhrfpdv.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_1bxgP0UIfxc5fWGLbwJhpQ_V6REmRv7";

const client =
supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let products=[];
let cart={};
let paymentMethod="現金";
let statusTimer=null;

const yen=n=>"¥"+Number(n).toLocaleString("ja-JP");

function setDefaultPickup(){
  const d=new Date();

  d.setMinutes(d.getMinutes()+30);
  d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);

  const p=n=>String(n).padStart(2,"0");

  document.getElementById("pickup").value=
  `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

setDefaultPickup();

function total(){
  return products.reduce(
    (sum,p)=>sum+(cart[p.id]||0)*p.price,
    0
  );
}

function refresh(){
  document.getElementById("total").textContent=yen(total());

  document.getElementById("orderBtn").disabled=
  Object.keys(cart).length===0;
}

function changeQty(id,delta){
  cart[id]=(cart[id]||0)+delta;

  if(cart[id]<=0){
    delete cart[id];
  }

  document.getElementById("q"+id).textContent=
  cart[id]||0;

  refresh();
}

async function loadProducts(){
  const menu=document.getElementById("menu");

  const {data,error}=await client
    .from("products")
    .select("id,name,price,category,is_available,sort_order,image_url")
  
    .order("sort_order",{ascending:true});

  if(error){
    menu.innerHTML=
    '<div class="notice err">商品取得エラー：'+
    error.message+
    '</div>';

    return;
  }

  products=data||[];
  menu.innerHTML="";

  products.forEach(p=>{
    const d=document.createElement("div");

    d.className="card";
　　　if(!p.is_available) d.classList.add("soldout");
    d.innerHTML=`
    ${p.image_url ? '<img src="' + p.image_url + '" alt="' + p.name + '" style="width:100%;height:180px;object-fit:cover;border-radius:16px;margin-bottom:14px;">' : ''}
      <div class="top">
        <div>
          <div class="name">${p.name}</div>
          <div class="cat">${p.category||""}</div>
        </div>

        <div class="price">${yen(p.price)}</div>
      </div>

      <div class="controls">
        <button onclick="changeQty(${p.id},-1)">−</button>
        <div class="qty" id="q${p.id}">0</div>
        <button onclick="changeQty(${p.id},1)">＋</button>
      </div>
    `;

    menu.appendChild(d);
  });
}

document.querySelectorAll(".pay").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".pay").forEach(x=>{
      x.classList.remove("on");
    });

    b.classList.add("on");
    paymentMethod=b.dataset.pay;
  };
});

function statusInfo(status){
  switch(status){

    case "cooking":
      return {
        icon:"🔥",
        title:"調理しています",
        message:"ただいまご注文の商品を調理しています。もうしばらくお待ちください。"
      };

    case "ready":
      return {
        icon:"🟢",
        title:"できました！",
        message:"商品ができあがりました。受取口までお越しください！"
      };

    case "done":
      return {
        icon:"🙏",
        title:"お渡し完了",
        message:"ご利用ありがとうございました！"
      };

    default:
      return {
        icon:"🟡",
        title:"注文を受け付けました",
        message:"ご注文を確認しています。そのままお待ちください。"
      };
  }
}

function renderOrder(orderNumber,totalAmount,status){
  const info=statusInfo(status);
  const result=document.getElementById("result");

  result.className="result show";

  result.innerHTML=`
    <div style="font-size:54px">${info.icon}</div>

    <h2>ご注文ありがとうございます</h2>

    <div>注文番号</div>

    <div class="orderno">
      ${orderNumber}
    </div>

    <p>
      合計 <b>${yen(totalAmount)}</b>
    </p>

    <div class="statusbox ${status||"new"}">

      <div class="statusicon">
        ${info.icon}
      </div>

      <div class="statustitle">
        ${info.title}
      </div>

      <div class="statusmessage">
        ${info.message}
      </div>

    </div>
  `;
}

async function checkOrderStatus(
  orderNumber,
  totalAmount
){
  const {data,error}=await client.rpc(
    "get_order_status",
    {
      p_order_number:orderNumber
    }
  );

  if(error){
    console.error("注文状況取得エラー",error);
    return;
  }

  if(!data){
    return;
  }

  renderOrder(
    data.order_number,
    totalAmount,
    data.status
  );

  if(data.status==="done" && statusTimer){
    clearInterval(statusTimer);
    statusTimer=null;
  }
}

function startStatusWatch(
  orderNumber,
  totalAmount
){
  if(statusTimer){
    clearInterval(statusTimer);
  }

  checkOrderStatus(
    orderNumber,
    totalAmount
  );

  statusTimer=setInterval(()=>{
    checkOrderStatus(
      orderNumber,
      totalAmount
    );
  },5000);
}

document.getElementById("orderBtn").onclick=async()=>{
  const name=
    document.getElementById("customerName").value.trim();

  const pickup=
    document.getElementById("pickup").value;

  const result=
    document.getElementById("result");

  if(!name){
    alert("お名前を入力してください");
    return;
  }

  if(!pickup){
    alert("受取時間を選択してください");
    return;
  }

  const items=
    Object.entries(cart).map(
      ([product_id,quantity])=>({
        product_id:Number(product_id),
        quantity:Number(quantity)
      })
    );

  const btn=
    document.getElementById("orderBtn");

  btn.disabled=true;
  btn.textContent="送信中...";

  const {data,error}=await client.rpc(
    "submit_order",
    {
      p_customer_name:name,
      p_pickup_time:new Date(pickup).toISOString(),
      p_payment_method:paymentMethod,
      p_items:items
    }
  );

  btn.textContent="注文を確定";

  if(error){
    btn.disabled=false;

    result.className="result show";

    result.innerHTML=
      '<div class="err">注文エラー</div><p>'+
      error.message+
      '</p>';

    return;
  }

  renderOrder(
    data.order_number,
    data.total_amount,
    "new"
  );

  startStatusWatch(
    data.order_number,
    data.total_amount
  );

  cart={};

  products.forEach(p=>{
    const e=document.getElementById("q"+p.id);

    if(e){
      e.textContent="0";
    }
  });

  refresh();

  result.scrollIntoView({
    behavior:"smooth"
  });
};

loadProducts();
</script>

<div style="margin:24px 16px;padding:20px;background:#fff;border-radius:16px;border:2px solid #222;">
  <h2 style="margin-top:0;">🔎 注文状況を確認</h2>
  <p>注文番号を入力してください</p>

  <input
    id="lookupOrderNumber"
    type="text"
    placeholder="例：C-1009"
    autocomplete="off"
    style="width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:1px solid #aaa;border-radius:10px;"
  >

  <button
    id="lookupOrderButton"
    type="button"
    style="width:100%;margin-top:12px;padding:14px;font-size:18px;font-weight:bold;border:0;border-radius:10px;background:#f4c430;color:#111;"
  >
    注文状況を確認する
  </button>

  <div id="lookupOrderResult" style="margin-top:16px;"></div>
</div>

<script>
document.getElementById("lookupOrderButton").addEventListener("click", async () => {
  const input = document.getElementById("lookupOrderNumber");
  const result = document.getElementById("lookupOrderResult");
　const orderNumber = "C-" + input.value.trim().replace(/^C-/i, "");
  if (!orderNumber) {
    result.innerHTML = "<b>注文番号を入力してください。</b>";
    return;
  }

  result.innerHTML = "検索中...";

  const { data, error } = await client.rpc("lookup_order", {
    p_order_number: orderNumber
  });

  if (error) {
    console.error(error);
    result.innerHTML = "<b>注文情報を取得できませんでした。</b>";
    return;
  }

  if (!data) {
    result.innerHTML = "<b>その注文番号は見つかりませんでした。</b>";
    return;
  }

  const statusText = {
    new: "注文を受け付けました",
    cooking: "調理中です",
    ready: "できました！",
    done: "お渡し完了"
  }[data.status] || data.status;

  const items = (data.items || []).map(item =>
    `<div>${item.product_name} × ${item.quantity}　¥${Number(item.subtotal).toLocaleString()}</div>`
  ).join("");

  const pickup = data.pickup_time
    ? new Date(data.pickup_time).toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      })
    : "-";

  result.innerHTML = `
    <div style="padding:16px;background:#fff8dc;border-radius:12px;">
      <div style="font-size:22px;font-weight:bold;">${data.order_number}</div>
      <div style="margin-top:10px;"><b>現在の状況：</b>${statusText}</div>
      <div style="margin-top:10px;"><b>受取予定：</b>${pickup}</div>
      <div style="margin-top:10px;">${items}</div>
      <div style="margin-top:10px;font-size:20px;font-weight:bold;">
        合計 ¥${Number(data.total_amount).toLocaleString()}
      </div>
    </div>
  `;
});
</script>
</body>
</html>
