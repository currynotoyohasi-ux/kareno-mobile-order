<script>

 const locationEl = document.getElementById("shopLocation");

if(data?.google_maps_url){

loadShopInfo();
let products=[];
let cart={};
  let cartDetails={};
  function makeCartKey(productId, selections = []) {
  if (!selections.length) return String(productId);

  const optionPart = selections
    .map(item => `${item.group_id}:${item.option_id}`)
    .sort()
    .join("|");

  return `${productId}__${optionPart}`;
}
let paymentMethod="現金";
let statusTimer=null;

const yen=n=>"¥"+Number(n).toLocaleString("ja-JP");

function setDefaultPickup(){
  const d=new Date();

  d.setMinutes(d.getMinutes()+30);
  d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);

  const p=n=>String(n).padStart(2,"0");

  document.getElementById("pickup").value=
  `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

setDefaultPickup();
  document.getElementById("pickup").addEventListener("change", refresh);
function isPickupWithinBusinessHours(){
  const pickupValue = document.getElementById("pickup").value;
  const hoursText =
    document.getElementById("shopHours").textContent || "";

  const match = hoursText.match(
    /(\d{1,2})月(\d{1,2})日\s*(\d{1,2}):(\d{2})〜(\d{1,2}):(\d{2})/
  );

  if(!pickupValue || !match){
    return false;
  }

  const pickup = new Date(pickupValue);

  const shopMonth = Number(match[1]);
  const shopDay = Number(match[2]);

  if(
    pickup.getMonth() + 1 !== shopMonth ||
    pickup.getDate() !== shopDay
  ){
    return false;
  }

  const pickupMinutes =
    pickup.getHours() * 60 + pickup.getMinutes();

  const openMinutes =
    Number(match[3]) * 60 + Number(match[4]);

  const closeMinutes =
    Number(match[5]) * 60 + Number(match[6]);

  return pickupMinutes >= openMinutes &&
         pickupMinutes <= closeMinutes;
}
 function total(){
  return Object.entries(cart).reduce((sum, [key, qty]) => {
    const productId =
      cartDetails[key]?.product_id ??
      Number(String(key).split("__")[0]);

    const product = products.find(
      p => Number(p.id) === Number(productId)
    );

    return sum + (product ? product.price * qty : 0);
  }, 0);
}

function refresh(){
  document.getElementById("total").textContent = yen(total());

  document.getElementById("orderBtn").disabled =
    Object.keys(cart).length === 0;
}
function handleRemoveProduct(id) {
  const productId = Number(id);

  const matchingKeys = Object.keys(cart).filter(key => {
    const itemProductId =
      cartDetails[key]?.product_id ??
      Number(String(key).split("__")[0]);

    return Number(itemProductId) === productId && cart[key] > 0;
  });

  if (matchingKeys.length === 0) return;

  const key = matchingKeys[matchingKeys.length - 1];

  cart[key] -= 1;

  if (cart[key] <= 0) {
    delete cart[key];
    delete cartDetails[key];
  }

  const productTotalQty = Object.entries(cart).reduce(
    (sum, [cartKey, qty]) => {
      const itemProductId =
        cartDetails[cartKey]?.product_id ??
        Number(String(cartKey).split("__")[0]);

      return Number(itemProductId) === productId
        ? sum + qty
        : sum;
    },
    0
  );

  const qtyEl = document.getElementById("q" + productId);

  if (qtyEl) {
    qtyEl.textContent = productTotalQty;
  }

  refresh();
}
  function changeQty(id, delta, selections = []) {
  
    const productId = Number(id);
  const key = makeCartKey(productId, selections);

  cart[key] = (cart[key] || 0) + delta;

  if (cart[key] <= 0) {
    delete cart[key];
    delete cartDetails[key];
  } else {
    cartDetails[key] = {
      product_id: productId,
      selections: selections
    };
  }

  const productTotalQty = Object.entries(cart).reduce(
    (sum, [cartKey, qty]) => {
      const itemProductId =
        cartDetails[cartKey]?.product_id ??
        Number(String(cartKey).split("__")[0]);

      return Number(itemProductId) === productId
        ? sum + qty
        : sum;
    },
    0
  );

  const qtyEl = document.getElementById("q" + productId);

  if (qtyEl) {
    qtyEl.textContent = productTotalQty;
  }

  refresh();
}

function refresh(){
  document.getElementById("total").textContent=yen(total());

 document.getElementById("orderBtn").disabled =
  Object.keys(cart).length===0;
}

 function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
} 
function handleAddProduct(id){
  const product = products.find(p => Number(p.id) === Number(id));

  if (!product) return;

  if (!product.customizations || product.customizations.length === 0) {
    changeQty(id, 1);
    return;
  }

  openCustomizationModal(product);
}
  function openCustomizationModal(product) {
  const oldModal = document.getElementById("customizationModal");

  if (oldModal) {
    oldModal.remove();
  }

  const overlay = document.createElement("div");
  overlay.id = "customizationModal";

  overlay.style.cssText = `
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  `;

  const groupsHtml = (product.customizations || []).map(group => {

    const options = (group.customization_options || []).map(option => `
      <label style="
        display:block;
        padding:10px 12px;
        margin:6px 0;
        border:1px solid #ddd;
        border-radius:10px;
        cursor:pointer;
      ">
        <input
          type="radio"
          name="customization-${group.id}"
          value="${option.id}"
          data-label="${escapeHtml(option.label)}"
          style="width:auto;margin-right:8px;"
        >
        ${escapeHtml(option.label)}
      </label>
    `).join("");

    return `
      <div
        class="customization-group"
        data-group-id="${group.id}"
        data-required="${group.is_required}"
        data-group-name="${escapeHtml(group.name)}"
        style="margin-bottom:20px;"
      >
        <div style="font-weight:bold;margin-bottom:8px;">
          ${escapeHtml(group.name)}
          <span style="
            font-size:12px;
            margin-left:6px;
            color:${group.is_required ? "#d33" : "#777"};
          ">
            ${group.is_required ? "必須" : "任意"}
          </span>
        </div>

        ${options}
      </div>
    `;
  }).join("");

  overlay.innerHTML = `
    <div style="
      width:100%;
      max-width:520px;
      max-height:85vh;
      overflow-y:auto;
      background:#fff;
      border-radius:18px;
      padding:20px;
      box-sizing:border-box;
    ">
      <h2 style="margin-top:0;">
        ${escapeHtml(product.name)}
      </h2>

      <div style="margin-bottom:18px;color:#555;">
        こだわりを選んでください
      </div>

      ${groupsHtml}

      <div style="
        display:flex;
        gap:10px;
        margin-top:20px;
      ">
        <button
          type="button"
          id="cancelCustomizationBtn"
          style="
            flex:1;
            padding:14px;
            border-radius:12px;
            border:1px solid #ccc;
            background:#fff;
          "
        >
          キャンセル
        </button>

        <button
          type="button"
          id="confirmCustomizationBtn"
          style="
            flex:1;
            padding:14px;
            border-radius:12px;
            border:none;
            background:#f5a000;
            font-weight:bold;
          "
        >
          決定
        </button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  document.getElementById("cancelCustomizationBtn").onclick = () => {
    overlay.remove();
  };
document.getElementById("confirmCustomizationBtn").onclick = () => {
  const selections = [];
  let missingRequired = false;

  (product.customizations || []).forEach(group => {
    const selected = overlay.querySelector(
      `input[name="customization-${group.id}"]:checked`
    );

    if (group.is_required && !selected) {
      missingRequired = true;
      return;
    }

    if (selected) {
      selections.push({
        group_id: group.id,
        group_name: group.name,
        option_id: Number(selected.value),
        option_label: selected.dataset.label
      });
    }
  });

  if (missingRequired) {
    alert("必須項目をすべて選択してください");
    return;
  }

  product._selectedCustomizations = selections;

  changeQty(product.id, 1, selections);
  overlay.remove();
};
  overlay.addEventListener("click", event => {
    if (event.target === overlay) {
      overlay.remove();
    }
  });
}
async function loadProducts(){
  const menu=document.getElementById("menu");

  const {data,error}=await client
    .from("products")
    .select("id,name,price,category,is_available,sort_order,image_url")
  
    .order("sort_order",{ascending:true});

  if(error){
    menu.innerHTML=
    '<div class="notice err">商品取得エラー：'+
    error.message+
    '</div>';

    return;
  }
const { data: customizationLinks, error: customizationError } =
  await client
    .from("product_customization_groups")
    .select(`
      product_id,
      customization_group_id,
      customization_groups (
        id,
        name,
        is_required,
        sort_order,
        customization_options (
          id,
          label,
          sort_order
        )
      )
    `);

if (customizationError) {
  menu.innerHTML =
    '<div class="notice err">カスタマイズ取得エラー：' +
    customizationError.message +
    '</div>';
  return;
}
  products=data||[];
  products = products.map(product => {
  const links = (customizationLinks || [])
    .filter(link => String(link.product_id) === String(product.id))
    .map(link => link.customization_groups)
    .filter(Boolean)
    .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

  links.forEach(group => {
    group.customization_options =
      (group.customization_options || [])
        .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  });

  return {
    ...product,
    customizations: links
  };
});
  menu.innerHTML="";

  products.forEach(p=>{
    const d=document.createElement("div");

    d.className="card";
　　　if(!p.is_available) d.classList.add("soldout");
    d.innerHTML=`
    ${p.image_url ? '<img src="' + p.image_url + '" alt="' + p.name + '" style="width:100%;height:180px;object-fit:cover;border-radius:16px;margin-bottom:14px;">' : ''}
      <div class="top">
        <div>
          <div class="name">${p.name}</div>
          <div class="cat">${p.category||""}</div>
        </div>

        <div class="price">${yen(p.price)}</div>
      </div>

      <div class="controls">
        <button onclick="handleRemoveProduct(${p.id})">−</button>
        <div class="qty" id="q${p.id}">0</div>
        <button onclick="event.stopPropagation(); handleAddProduct(${p.id})">+</button>
      </div>
    `;

    menu.appendChild(d);
  });
}

document.querySelectorAll(".pay").forEach(b=>{

function statusInfo(status){

        title:"調理しています",
        message:"ただいまご注文の商品を調理しています。もうしばらくお待ちください。"
      };

    case "ready":
      return {
        icon:"🟢",
        title:"できました！",
        message:"商品ができあがりました。受取口までお越しください！"
      };

    case "done":
      return {
        icon:"🙏",

        message:"ご利用ありがとうございました！"
      };

    default:
      return {
        icon:"🟡",
        title:"注文を受け付けました",
        message:"ご注文を確認しています。そのままお待ちください。"
      };

}

async function checkOrderStatus(
  orderNumber,
  totalAmount
){
  const {data,error}=await client.rpc(
    "get_order_status",
    {
      p_order_number:orderNumber
    }
  );

  if(error){
    console.error("注文状況取得エラー",error);
    return;
  }

  if(!data){
    return;
  }

  renderOrder(
    data.order_number,
    totalAmount,
    data.status
  );

  if(data.status==="done" && statusTimer){
    clearInterval(statusTimer);
    statusTimer=null;
  }
}

function startStatusWatch(
  orderNumber,
  totalAmount
){
  if(statusTimer){
    clearInterval(statusTimer);
  }

  checkOrderStatus(
    orderNumber,
    totalAmount
  );

  statusTimer=setInterval(()=>{
    checkOrderStatus(
      orderNumber,
      totalAmount
    );
  },5000);
}

document.getElementById("orderBtn").onclick=async()=>{
  const name=
    document.getElementById("customerName").value.trim();

  const pickup=
    document.getElementById("pickup").value;
if(!isPickupWithinBusinessHours()){
  alert("受付時間外です。営業日・営業時間内の受取時間を選択してください。");
  return;
}
  const result=
    document.getElementById("result");

  if(!name){
    alert("お名前を入力してください");
    return;
  }

  if(!pickup){
    alert("受取時間を選択してください");
    return;
  }

  const items =
  Object.entries(cart).map(([key, quantity]) => {
    const detail = cartDetails[key];

    const productId =
      detail?.product_id ??
      Number(String(key).split("__")[0]);

    return {
      product_id: Number(productId),
      quantity: Number(quantity),
      customizations: detail?.selections || []
    };
  });

  const btn=
    document.getElementById("orderBtn");

  btn.disabled=true;
  btn.textContent="送信中...";

  const {data,error}=await client.rpc(
    "submit_order",
    {
      p_customer_name:name,
      p_pickup_time:new Date(pickup).toISOString(),
      p_payment_method:paymentMethod,
      p_items:items
    }
  );

  btn.textContent="注文を確定";

  if(error){
    btn.disabled=false;

    result.className="result show";

    result.innerHTML=
      '<div class="err">注文エラー</div><p>'+
      error.message+
      '</p>';

    return;
  }

  renderOrder(
    data.order_number,
    data.total_amount,
    "new"
  );

  startStatusWatch(
    data.order_number,
    data.total_amount
  );

  cart={};

  products.forEach(p=>{
    const e=document.getElementById("q"+p.id);

    if(e){
      e.textContent="0";
    }
  });

  refresh();

  result.scrollIntoView({
    behavior:"smooth"
  });
};

    type="text"

  <button

    type="button"

  >
    注文状況を確認する
  </button>

  <div id="lookupOrderResult" style="margin-top:16px;"></div>
</div>

<script>
document.getElementById("lookupOrderButton").addEventListener("click", async () => {
  const input = document.getElementById("lookupOrderNumber");
  const result = document.getElementById("lookupOrderResult");
　const orderNumber = "C-" + input.value.trim().replace(/^C-/i, "");
  if (!orderNumber) {
    result.innerHTML = "<b>注文番号を入力してください。</b>";
    return;
  }

  result.innerHTML = "検索中...";

  const { data, error } = await client.rpc("lookup_order", {
    p_order_number: orderNumber
  });

  if (error) {
    console.error(error);
    result.innerHTML = "<b>注文情報を取得できませんでした。</b>";
    return;
  }

  if (!data) {
    result.innerHTML = "<b>その注文番号は見つかりませんでした。</b>";
    return;
  }

  const statusText = {
    new: "注文を受け付けました",
    cooking: "調理中です",
    ready: "できました！",
    done: "お渡し完了"
  }[data.status] || data.status;

  const items = (data.items || []).map(item =>
    `<div>${item.product_name} × ${item.quantity}　¥${Number(item.subtotal).toLocaleString()}</div>`
  ).join("");

  const pickup = data.pickup_time
    ? new Date(data.pickup_time).toLocaleString("ja-JP", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      })
    : "-";

  result.innerHTML = `
    <div style="padding:16px;background:#fff8dc;border-radius:12px;">
      <div style="font-size:22px;font-weight:bold;">${data.order_number}</div>
      <div style="margin-top:10px;"><b>現在の状況：</b>${statusText}</div>
      <div style="margin-top:10px;"><b>受取予定：</b>${pickup}</div>
      <div style="margin-top:10px;">${items}</div>
      <div style="margin-top:10px;font-size:20px;font-weight:bold;">
        合計 ¥${Number(data.total_amount).toLocaleString()}
      </div>
    </div>
  `;
});
</script>
